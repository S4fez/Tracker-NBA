<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside Ledger · Hybrid preview (live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="hybrid-loader.js"></script>
<script src="hybrid-core.js"></script>
<link rel="stylesheet" href="hybrid-1.css">
<link rel="stylesheet" href="hybrid-2.css">
</head>
<body>
<div class="app" id="app" data-collapsed="false">
  <div class="side-col"><aside class="side" aria-label="เมนูหลัก">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3.4 3.2 3.4 9.6 0 12.8M18.4 5.6c-3.4 3.2-3.4 9.6 0 12.8"/></svg></span>
      <span class="brand-txt"><b>Courtside Ledger</b><span>NBA bet analytics</span></span>
    </div>
    <nav class="nav" id="sideNav" aria-label="หน้าหลัก"></nav>
    <div class="side-foot">
      <div class="side-meta" id="sideMeta"></div>
      <button class="btn-collapse" id="collapseBtn" type="button" aria-expanded="true" aria-controls="sideNav">
        <svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>ย่อเมนู</span>
      </button>
    </div>
  </aside></div>
  <div class="main">
    <header class="topbar">
      <a class="m-back" id="mBack" href="#/tickets" aria-label="กลับไปหน้าบิลทั้งหมด" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></a>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <button class="btn cmd-btn" type="button" id="cmdBtn" aria-haspopup="dialog" aria-label="ค้นหาและไปยัง (Ctrl K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span>ค้นหาบิล ทีม เกม…</span><kbd>⌘K</kbd></button>
      <span class="pill" title="ข้อมูลอ่านอย่างเดียว ไม่มีการเขียนกลับฐานข้อมูล"><span class="dot" aria-hidden="true"></span>ข้อมูลสด · อ่านอย่างเดียว</span>
    </header>
    <div class="ticker" role="region" aria-label="สกอร์บอร์ดเกมที่เกี่ยวกับบิลของฉัน">
      <div class="ticker-lab"><b>Scores</b><span>เกมในบิลของฉัน</span></div>
      <button class="ticker-btn" type="button" id="tkPrev" aria-label="เลื่อนสกอร์ไปทางซ้าย"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="ticker-track" id="ticker" tabindex="0" aria-label="ผลเกมและเวลาเริ่มเกม (เลื่อนได้)"></div>
      <button class="ticker-btn" type="button" id="tkNext" aria-label="เลื่อนสกอร์ไปทางขวา"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <main class="content" id="view" tabindex="-1"></main>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="แท็บหลัก"></nav>

<dialog class="sheet" id="filterSheet" aria-labelledby="sheetTitle">
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-h"><h2 id="sheetTitle">ตัวกรองและการเรียง</h2>
    <button class="btn ghost" type="button" id="sheetClose" aria-label="ปิดตัวกรอง" style="width:44px;height:44px;padding:0"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <form class="sheet-b" id="sheetForm" method="dialog">
    <fieldset><legend>สถานะบิล</legend><div class="opt-grid" id="sheetStatus"></div></fieldset>
    <fieldset><legend>เรียงตาม</legend><div class="opt-grid" id="sheetSort"></div></fieldset>
    <fieldset><legend>จำนวนคู่ในบิล</legend><div class="range"><label class="sr-only" for="sLegMin">อย่างน้อย</label><select class="select" id="sLegMin"></select><span>ถึง</span><label class="sr-only" for="sLegMax">ไม่เกิน</label><select class="select" id="sLegMax"></select></div></fieldset>
    <fieldset><legend>ช่วงวันที่วางบิล</legend><div class="range"><label class="sr-only" for="sFrom">ตั้งแต่</label><input class="input" type="date" id="sFrom"><span>–</span><label class="sr-only" for="sTo">ถึง</label><input class="input" type="date" id="sTo"></div></fieldset>
  </form>
  <div class="sheet-f"><button class="btn" type="button" id="sheetReset">ล้างตัวกรอง</button><button class="btn primary" type="button" id="sheetApply">แสดงผล</button></div>
</dialog>

<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk-scrim" data-cmdk-close></div>
  <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="ค้นหาและไปยัง">
    <div class="cmdk-in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <label for="cmdkQ" class="sr-only">ค้นหาบิล ทีม เกม หรือหน้า</label>
      <input id="cmdkQ" type="text" autocomplete="off" spellcheck="false" placeholder="เลขบิล รหัสบิล ทีม (เช่น DEN) หรือชื่อหน้า…" role="combobox" aria-expanded="true" aria-controls="cmdkList" aria-autocomplete="list">
      <button class="btn ghost" type="button" data-cmdk-close aria-label="ปิดการค้นหา"><kbd>Esc</kbd></button></div>
    <ul class="cmdk-list" id="cmdkList" role="listbox" aria-label="ผลการค้นหา"></ul>
    <div class="cmdk-foot d-only"><span><kbd>↑</kbd> <kbd>↓</kbd> เลื่อน</span><span><kbd>Enter</kbd> เปิด</span><span><kbd>Esc</kbd> ปิด</span><span><kbd>1</kbd>–<kbd>5</kbd> สลับหน้า (นอกช่องพิมพ์)</span></div>
  </div>
</div>
<div id="soRoot"></div>

</body>
</html>
